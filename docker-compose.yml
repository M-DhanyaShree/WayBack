version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: wayback_db
    environment:
      POSTGRES_USER: wayback
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wayback_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
    container_name: wayback_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://wayback:password@db:5432/wayback_db?schema=public
      - JWT_SECRET=super_secret_dev_key
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: wayback_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  db_data:
